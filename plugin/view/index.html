<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering OS Live View</title>
<style>
/* Engineering OS live view (D33). Read-only: built from .engos/status.js, which the hooks rewrite on every
   ledger event. It has no controls that approve, reject or decide anything (E2, D34). */
:root {
  --bg: #eef0f2; --card: #ffffff; --sunk: #f5f6f8; --ink: #16191d; --ink-2: #5d6570; --line: #d6dae0;
  --haiku: #13897a; --sonnet: #2f62c9; --opus: #7445c2; --fable: #b9741a; --human: #16191d;
  --ok: #1f8a4c; --bad: #c2392f; --warn: #b9741a;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --sunk: #12161b; --ink: #e7eaee; --ink-2: #98a1ad; --line: #2a3039;
    --haiku: #3cc3b0; --sonnet: #6f9bff; --opus: #b18cff; --fable: #f0a748; --human: #e7eaee;
    --ok: #4cc57f; --bad: #ff6b5f; --warn: #f0a748; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --card: #171b21; --sunk: #12161b; --ink: #e7eaee; --ink-2: #98a1ad; --line: #2a3039;
  --haiku: #3cc3b0; --sonnet: #6f9bff; --opus: #b18cff; --fable: #f0a748; --human: #e7eaee;
  --ok: #4cc57f; --bad: #ff6b5f; --warn: #f0a748; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 16px 48px; display: grid; gap: 16px; }
.mono { font-family: var(--f-mono); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; }
.muted { color: var(--ink-2); }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.head .left { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; min-width: 0; }
.brand { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.brand i { width: 10px; height: 10px; border-radius: 2px; background: var(--ink); transform: rotate(45deg); display: inline-block; }
.task { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.title { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.chip { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.chip.cls { border-color: var(--sonnet); color: var(--sonnet); }
.chip.high_risk { border-color: var(--bad); color: var(--bad); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.live { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.live b { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.live.stale b { background: var(--warn); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: inherit; font-family: var(--f-mono); font-size: 12px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.tab[aria-pressed="true"] { border-color: var(--sonnet); color: var(--sonnet); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.stat .v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .v small { font-size: 14px; font-weight: 400; color: var(--ink-2); }
.stat .s { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; overflow-wrap: anywhere; }
.stat.alert { border-color: var(--warn); }
.stat.alert .v { color: var(--warn); }
.main { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px; }
.graph { overflow-x: auto; }
.graph svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--f-ui); }
.n-box { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.n-lead { stroke: var(--opus); stroke-width: 1.6; }
.n-human { fill: var(--sunk); stroke: var(--human); }
.t-name { fill: var(--ink); font-size: 14px; font-weight: 600; }
.t-sub { fill: var(--ink-2); font-size: 11.5px; }
.t-mono { fill: var(--ink-2); font-size: 10.5px; font-family: var(--f-mono); }
.t-edge { fill: var(--ink-2); font-size: 10.5px; font-family: var(--f-mono); }
.e { fill: none; stroke: var(--ink-2); stroke-width: 1.3; opacity: .7; }
.e.active { stroke: var(--sonnet); stroke-width: 2; opacity: 1; }
.e.wait { stroke-dasharray: 4 4; opacity: .5; }
.e.appr { stroke: var(--warn); stroke-dasharray: 5 4; stroke-width: 1.6; opacity: 1; }
.e.bad { stroke: var(--bad); opacity: .9; }
.ring { fill: none; stroke: var(--sonnet); stroke-width: 2; opacity: .55; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08); } }
.flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) { .ring, .flow { animation: none; } }
.gate-band { fill: var(--sunk); stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend b { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 14px; }
.stp { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--sunk); font-size: 12.5px; }
.stp .h { display: flex; justify-content: space-between; gap: 6px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
.stp.done .h b { color: var(--ok); } .stp.run { border-color: var(--sonnet); } .stp.run .h b { color: var(--sonnet); }
.stp.bad { border-color: var(--bad); } .stp.bad .h b { color: var(--bad); }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; max-height: 560px; overflow-y: auto; }
.feed li { display: grid; grid-template-columns: 44px 12px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; font-size: 13px; }
.feed li:last-child { border-bottom: 0; }
.feed time { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); padding-top: 2px; font-variant-numeric: tabular-nums; }
.feed .d { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--ink-2); }
.feed .d.ok { background: var(--ok); } .feed .d.bad { background: var(--bad); } .feed .d.run { background: var(--sonnet); } .feed .d.warn { background: var(--warn); }
.feed .who { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
.bottom { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
.rows { display: grid; gap: 8px; }
.row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: 13px; }
.row:last-child { border-bottom: 0; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.wait-item { border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--warn) 7%, var(--card)); }
.wait-item + .wait-item { margin-top: 8px; }
.wait-item code { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.how { font-family: var(--f-mono); font-size: 12px; margin-top: 6px; color: var(--ink-2); }
.empty { color: var(--ink-2); font-size: 13px; }
footer { color: var(--ink-2); font-size: 12px; text-align: center; }
@media (max-width: 900px) { .main, .bottom { grid-template-columns: 1fr; } }
@media (max-width: 620px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
/* interactive parts */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.btn-s { font: inherit; font-family: var(--f-mono); font-size: 12px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn-s[aria-pressed="true"] { border-color: var(--sonnet); color: var(--sonnet); }
.btn-s:focus-visible, .tab:focus-visible, .node:focus-visible, .stp:focus-visible, .feed li:focus-visible { outline: 2px solid var(--sonnet); outline-offset: 2px; }
.tab.closed { color: var(--ink-2); }
.node { cursor: pointer; outline: none; }
.node:hover .n-box { stroke: var(--ink-2); }
.node.sel .n-box { stroke: var(--ink); stroke-width: 2.4; }
.stp { cursor: pointer; }
.stp.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
.feed li { cursor: pointer; }
.feed li .more { display: none; grid-column: 3; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); background: var(--sunk); border-radius: 6px; padding: 6px 8px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.feed li.open .more { display: block; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-2); font-family: var(--f-mono); font-size: 11.5px; padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.detail h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 14px 0 6px; }
.list { margin: 0; padding-left: 18px; font-size: 13px; }
.list li { margin: 2px 0; overflow-wrap: anywhere; }
.sev { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.sev.high, .sev.critical { color: var(--bad); border-color: var(--bad); } .sev.medium { color: var(--warn); border-color: var(--warn); }
.files { display: grid; gap: 4px; font-size: 13px; }
.files div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.files div:last-child { border-bottom: 0; }
.files code { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
@media (max-width: 900px) { .three { grid-template-columns: 1fr; } }
/* v0.1 additions: health, cost, timeline lanes, diff, replay, projects, Arabic */
.stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.health { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); padding: 0 4px; }
.health b { color: var(--ink); font-weight: 500; }
.health .warn { color: var(--warn); }
.mbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); margin-top: 8px; }
.mbar i { display: block; height: 100%; }
.lanes { overflow-x: auto; }
.lanes svg { display: block; width: 100%; min-width: 560px; height: auto; }
.lane-label { fill: var(--ink-2); font-size: 11px; font-family: var(--f-mono); }
.lane-bg { fill: var(--sunk); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay .card { width: min(980px, 100%); max-height: 86vh; overflow: auto; }
.diff { font-family: var(--f-mono); font-size: 12px; white-space: pre; overflow-x: auto; margin: 0; direction: ltr; text-align: left; }
.diff .a { color: var(--ok); } .diff .d { color: var(--bad); } .diff .h { color: var(--ink-2); }
.replay input[type=range] { width: 100%; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
.badge { font-family: var(--f-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--warn); color: var(--warn); margin-inline-start: 6px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] body { font-family: "Segoe UI", Tahoma, system-ui, sans-serif; }
[dir="rtl"] .graph, [dir="rtl"] .lanes { direction: ltr; }
[dir="rtl"] .eyebrow, [dir="rtl"] .sub { letter-spacing: 0; text-transform: none; font-family: var(--f-ui); font-size: 12px; }
[dir="rtl"] .stat .s, [dir="rtl"] .kv dd, [dir="rtl"] .how, [dir="rtl"] .who, [dir="rtl"] .list li, [dir="rtl"] .feed li > div, [dir="rtl"] .title, [dir="rtl"] .health { unicode-bidi: plaintext; }
</style>

    if (!el) return;
    if (el.id === 'pause') { state.paused = !state.paused; if (!state.paused) poll(); render(); return; }
    if (el.id === 'lang') { state.lang = state.lang === 'ar' ? 'en' : 'ar'; store('lang', state.lang); applyLang(); render(); return; }
    if (el.id === 'theme') { state.theme = state.theme === '' ? 'dark' : state.theme === 'dark' ? 'light' : ''; store('theme', state.theme); applyTheme(); render(); return; }
    if (el.id === 'notify') {
      if (state.notify) { state.notify = false; store('notify', ''); render(); return; }
      Notification.requestPermission().then(function (p) { state.notify = p === 'granted'; store('notify', state.notify ? '1' : ''); render(); });
      return;
    }
    if (el.id === 'projects') { state.view = state.view === 'projects' ? 'task' : 'projects'; if (state.view === 'projects') { state.projects = null; load('projects.js', 'x=1'); } render(); return; }
    if (el.id === 'replay') {
      if (state.view === 'replay') { state.view = 'task'; state.replay = null; render(); return; }
      state.view = 'replay'; state.replay = { task: state.selected, events: null, idx: 0 }; load('events.js', 'task=' + encodeURIComponent(state.selected)); render(); return;
    }
    if (el.id === 'export') { var tt = allTasks(state.status).filter(function (x) { return x.task_id === state.selected; })[0]; if (tt) exportReport(tt); return; }
    if (el.id === 'close-diff') { state.diff = null; render(); return; }
    if (el.hasAttribute('data-diff')) {
      if (!SERVED) return;
      state.diff = { file: el.getAttribute('data-diff'), text: null }; load('diff.js', 'task=' + encodeURIComponent(state.selected) + '&file=' + encodeURIComponent(state.diff.file)); render(); return;
    }
    if (el.hasAttribute('data-task')) { state.selected = el.getAttribute('data-task'); state.sel = null; state.view = 'task'; state.replay = null; render(); return; }
    if (el.hasAttribute('data-sel')) { state.sel = el.getAttribute('data-sel'); render(); return; }
    if (el.hasAttribute('data-filter')) { state.filter = el.getAttribute('data-filter'); render(); return; }
    if (el.hasAttribute('data-ev')) { var id = el.getAttribute('data-ev'); state.open[id] = !state.open[id]; render(); }
  }
  document.addEventListener('click', function (e) { activate(e.target.closest('[data-sel],[data-filter],[data-task],[data-ev],[data-diff],#pause,#lang,#theme,#notify,#projects,#replay,#export,#close-diff')); });
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'replay-range' && state.replay) { state.replay.idx = Number(e.target.value); render(); var r = document.getElementById('replay-range'); if (r) r.focus(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.diff) { state.diff = null; render(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest && e.target.closest('[data-sel],[data-ev]');
    if (el) { e.preventDefault(); activate(el); }
  });

  poll();
  setInterval(function () { if (!state.paused) poll(); }, 2000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
