name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compiled defaults match config/
        shell: bash
        run: |
          node tools/build-defaults.js
          git diff --exit-code -- plugin/defaults plugin/templates
      - name: Unit tests
        shell: bash
        run: node --test tests/unit/*.test.js
      - name: Hook latency
        shell: bash
        run: node tools/measure-hook.js
