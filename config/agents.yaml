# Engineering OS — agents and roles (defaults shipped with the plugin)
# Source of truth for decisions: docs/decisions.md.
#
# Three subagent files (D23). Roles are short prompt cards injected by the
# SubagentStart hook, not separate agents (D5). Tier is chosen by the router
# per call and checked by the gate.

schema: engos/agents@1

lead:
  is: main_session
  owns: task_outcome                   # D25
  always_does: [intake, plan, merge_results, talk_to_human]
  does_itself: [question, trivial_edit, lead_integration_edit]
  can_never:                           # D25
    - skip_a_failed_check
    - change_acceptance_criteria_without_recorded_amendment
    - close_a_task                     # engos CLI closes when evidence exists
    - grant_an_approval
    - lower_a_class

agents:
  scout:
    file: agents/scout.md
    tier: fast
    purpose: heavy reading, search, log triage
    tools: [Read, Grep, Glob, Bash]    # Bash limited to class `read` by the gate
    can_edit: false
    can_spawn_agents: false
    effort: low                        # default, tune
  worker:
    file: agents/worker.md
    tier: per_call                     # model parameter set by the router, checked by the gate
    purpose: implement one step inside its scope
    tools: [Read, Grep, Glob, Edit, Write, Bash]
    can_spawn_agents: false
    effort: medium                     # default, tune
  validator:
    file: agents/validator.md
    tier: per_call                     # from assurance (config/rules.yaml validator_tier_rules)
    purpose: judge scope and sufficiency of evidence; never edits
    tools: [Read, Grep, Glob, Bash]    # Bash limited to read + configured checks
    can_edit: false
    can_spawn_agents: false
    effort: medium                     # default, tune

built_in_agents_allowed_in_task: [Explore, Plan]   # D24

# Step kinds: who runs a planned step and the role card it gets. The router picks the tier
# (config/rules.yaml step_tier_rules). Unknown kinds run on a worker as implementer.
step_kinds:
  locate:          { by: scout, role: triager }
  search:          { by: scout, role: analyst }
  extract:         { by: scout, role: analyst }
  read_logs:       { by: scout, role: triager }
  triage:          { by: scout, role: triager }
  summarize:       { by: scout, role: analyst }
  inventory:       { by: scout, role: analyst }
  analyze:         { by: worker, role: analyst }
  implement:       { by: worker, role: implementer }
  tests:           { by: worker, role: implementer }
  docs:            { by: worker, role: implementer }
  design:          { by: worker, role: architect }
  plan_migration:  { by: worker, role: architect }
  critique:        { by: validator, role: critic }
  verify:          { by: validator, role: evidence_validator }
  review:          { by: validator, role: evidence_validator }
  review_security: { by: validator, role: security_reviewer }

roles:                                 # cards: keep each under ~1,500 characters
  implementer:       { does: "make the scoped change; report files changed and checks run" }
  triager:           { does: "locate the failure; cite exact files, lines or log lines" }
  analyst:           { does: "separate verified facts (with source) from assumptions" }
  architect:         { does: "compare options with trade-offs; state what would change the choice" }
  critic:            { does: "find the weakest assumption in a proposal and how to test it" }
  security_reviewer: { does: "find security, privacy and permission risk with evidence and severity" }
  evidence_validator: { does: "re-check each finding's evidence; confirm, downgrade or mark not reproduced" }
  incident_lead:     { does: "connect findings across components; propose next diagnostic step" }

role_rules:                            # minimum per kind; the lead may add, never remove
  bugfix:          [triager, implementer]
  feature:         [implementer]
  refactor:        [implementer]
  debugging:       [triager, implementer]
  analysis:        [analyst]
  architecture:    [architect, critic]
  security_review: [security_reviewer, evidence_validator]
  docs:            [implementer]
  add_when:
    - { when: { class: high_risk, sensitivity: [auth, secrets, payments] }, role: security_reviewer }
    - { when: { cross_system: true }, role: incident_lead }

disputes:                              # D25
  check_failed: "fact; no dispute"
  judgement_standard: { settled_by: lead, limit_per_task: 1, recorded: true }
  judgement_high_risk: { settled_by: human }
  security_finding_medium_or_higher: { settled_by: human, any_class: true }
  scope_violation_protected: { settled_by: human }
  criterion_wrong_or_flaky: { standard: lead_with_recorded_amendment, high_risk: human }

handoff:
  brief_schema: engos/brief@1          # docs/execution-contract.md
  report_schema: engos/report@1
  required_fields: [objective, scope, inputs_read, outputs_changed, evidence, limitations, next_action]
