# Engineering OS — policies (defaults shipped with the plugin)
# Source of truth for decisions: docs/decisions.md.

schema: engos/policies@1

threat_model:                          # D7
  protects_against: [honest_mistakes, model_misled_by_injected_instructions]
  out_of_scope_v0_1: [model_deliberately_bypassing_rules, os_level_isolation]
  readme_statement: >
    Engineering OS prevents common mistakes and detects indirect changes inside the repo
    after they happen. It is not a sandbox and does not stop a model that is deliberately
    trying to get around it.

modes:
  read_only:
    allowed: [read, search, configured_checks_without_side_effects]
    denied: [Edit, Write, NotebookEdit, mutating_bash]
  workspace_write:
    allowed: [edit_inside_scope, local_git, configured_checks, local_package_install_observed]
    denied: [external_actions_without_approval]
  default_mode: read_only              # every session starts here until a task opens
  requires_git_for_write: true         # D11

hard_gates:                            # cannot be lowered by human command, project config or pause (D12, D29)
  - { id: G-delivery, when: "bash class in [vcs_remote, network, destructive] or external MCP tool", require: approval_per_action }
  - { id: G-protected, when: "write to high_risk protected path", require: scope_approval }
  - { id: G-never, when: "write to never path", require: deny }
  - { id: G-self, when: "bash class self_protect (includes running claude, D34)", require: deny }
  - { id: G-prod, when: "deploy to production", require: deny }       # v0.1 never deploys to production

approvals:
  only_from: human                     # D4
  request_written_by: gate             # from the real tool input, never by the model
  id_format: "APR-<first 8 hex of action hash>"
  hash_binds: [tool_name, normalized_input, cwd, task_id, git_head, git_branch, script_sha256_if_local_script]
  show_to_user: exact_action_plus_context   # D16
  context_by_kind:
    push: [branch, outgoing_commits]
    scope: [file_list, task_reason]
    delete: [files_to_remove]
  kinds:                               # D14, D17
    action:
      covers: "one push, publish, network call, destructive command or external MCP call"
      method: native_permission_prompt
      single_use: true
      expires_after: 1h
      void_on: new_commit
    scope:
      covers: "editing listed high_risk paths for one task"
      method: typed_command            # /engos:approve APR-xxxxxxxx
      expires: on_task_close
      max_lifetime: 24h
    decision:
      covers: "blocked task, dispute, detected violation, high_risk amendment"
      method: typed_command            # /engos:decide DEC-xxx <option>
  fallback:                            # D15
    when_permission_mode_in: [bypassPermissions, auto]
    use: typed_command
  headless: deny_all_requiring_approval
  blanket_approvals: false             # D18
  rejection:                           # D19
    recorded: true
    same_hash_again_in_task: deny
  capture:                             # D34
    hook: UserPromptExpansion
    match: whole_line                  # ^/engos:approve APR-[0-9a-f]{8}$
    require_same_session_id: true
    void_if_session_resumed_or_forked_after_request: true   # D35
    require_pending_request: true
    reject_if_expired: true

pause:                                 # D29
  command: /engos:pause
  typed_by: human
  lasts: current_session
  turns_off: [classification, plans, validation]
  keeps: hard_gates

knowledge:
  never_store: [secrets, tokens, private_keys, raw_credentials]
  facts_need_source: true              # path:line, command output, or human
  assumptions_marked: true             # status: assumed, needs: human_confirmation
  secret_found_in_diff_or_state: needs_human

state_files:
  changed_only_by: engos_cli           # hand-editing YAML is denied by the gate
  committed: [.engos/config.yaml, .engos/BRIEF.md, .engos/STATE.yaml]      # D28
  local_only: [.engos/tasks/, .engos/approvals/, .engos/ledger.jsonl, .engos/status.json]

platform:
  surfaces:                             # D39
    supported: [terminal_cli, desktop_code_tab, ide_extensions, remote_control_from_phone]
    to_verify: [claude_code_web]
    not_supported: [desktop_chat_tab, claude_ai, mobile_chat, cowork]
  min_claude_code: "first version with hook onFailure: block (tested on 2.1.321)"   # D27
  min_claude_code_version: "2.1.321"    # D42: newest tested; lower it only after testing an older version
  version_source: "CLAUDE_CODE_EXECPATH --version"
  version_unknown: warn
  older_version: start_read_only_and_ask_to_update
  runtime: node                         # D26
  runtime_missing: block_with_install_instructions
  hooks_on_failure: block               # D34, spike R4/R5
